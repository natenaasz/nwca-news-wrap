name: Collect Articles

# The site feed only holds its 10 newest items. Save every article hourly so a busy week
# can't push stories out of the feed before Friday's episode is built.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: collect-articles
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Save new articles
        run: python news_wrap.py collect
        env:
          SITE_RSS_URL: ${{ vars.SITE_RSS_URL }}
      - name: Commit if anything changed
        run: |
          [ -z "$(git status --porcelain -- data/articles.json)" ] && { echo "No new articles."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          git commit -m "Collect articles $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
